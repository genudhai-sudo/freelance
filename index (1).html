<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KipTalent — Find the Right Talent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  :root {
    --bg: #faf8ff;
    --surface: #ffffff;
    --ink: #131b2e;
    --ink-2: #3d4947;
    --ink-muted: #bcc9c6;
    --brand: #00685f;
    --brand-2: #008378;
    --accent: #fea619;
    --accent-ink: #855300;
    --chip: #f2f3ff;
    --peach: #ffddb8;
    --sky: #c9e6ff;
    --border: rgba(188, 201, 198, 0.3);
    --shadow-card: 0 1px 1px rgba(0,0,0,0.05);
    --shadow-float: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  html, body { overflow-x: hidden; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink-2); background: var(--bg); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }
  img, svg { max-width: 100%; display: block; }
  section[id] { scroll-margin-top: 90px; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

  .container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer; border-radius: 9999px; padding: 14px 32px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; white-space: nowrap; transition: transform .15s ease, background .15s ease, box-shadow .15s ease; text-decoration: none; }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1); }
  .btn-primary:hover { background: #005a52; }
  .btn-white { background: #fff; color: var(--brand); box-shadow: var(--shadow-float); }
  .btn-outline { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.3); backdrop-filter: blur(2px); }
  .btn-soft { background: rgba(0,104,95,.1); color: var(--brand); padding: 8px 16px; border-radius: 12px; font-size: 12px; }
  .btn-soft:hover { background: rgba(0,104,95,.16); }
  .btn-chip { background: var(--chip); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-size: 12px; }
  .btn-chip:hover { background: #e4e6ff; }

  /* ---------- Header ---------- */
  .site-header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.9); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); box-shadow: 0 1px 8px rgba(0,0,0,.04); }
  .header-inner { height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .brand { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px; color: var(--ink); letter-spacing: -.5px; white-space: nowrap; }
  .nav { display: flex; align-items: center; gap: 24px; }
  .nav a { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink-2); letter-spacing: .14px; white-space: nowrap; padding: 6px 0; border-bottom: 2px solid transparent; }
  .nav a:hover { color: var(--brand); }
  .nav a.active { color: var(--brand); font-weight: 700; }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  .link-btn { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; padding: 8px 16px; color: var(--ink-2); background: none; border: 0; cursor: pointer; }
  .link-btn:hover { color: var(--brand); }
  .outline-btn { border: 1px solid rgba(188,201,198,.6); border-radius: 8px; padding: 9px 17px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink); background: #fff; cursor: pointer; }
  .outline-btn:hover { background: var(--chip); }
  .solid-btn { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 8px 24px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: var(--shadow-card); }
  .solid-btn:hover { background: #005a52; }
  .avatar-sm { width: 32px; height: 32px; border-radius: 9999px; background: linear-gradient(135deg, #00685f, #fea619); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 12px; display: grid; place-items: center; border: 0; cursor: pointer; }
  .menu-toggle { display: none; background: #fff; border: 1px solid var(--border); border-radius: 10px; width: 40px; height: 40px; cursor: pointer; color: var(--ink); font-size: 18px; }
  .mobile-nav { display: none; background: #fff; border-top: 1px solid var(--border); }
  .mobile-nav.open { display: block; }
  .mobile-nav a, .mobile-nav button { display: block; width: 100%; text-align: left; padding: 14px 20px; border: 0; border-bottom: 1px solid var(--border); background: none; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); cursor: pointer; }

  /* ---------- Hero ---------- */
  .hero { position: relative; overflow: hidden; padding: 96px 0; background: linear-gradient(180deg, #f2f3ff 0%, #faf8ff 50%, #faf8ff 100%); }
  .glow { position: absolute; width: 384px; height: 384px; border-radius: 9999px; filter: blur(32px); pointer-events: none; }
  .glow-teal { background: rgba(0,104,95,.1); left: -128px; top: -128px; }
  .glow-amber { background: rgba(254,166,25,.15); right: -128px; bottom: -128px; }
  .hero-grid { position: relative; display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 40px; align-items: center; }
  .hero-left { grid-column: 1 / span 3; display: flex; flex-direction: column; gap: 16px; }
  .hero-center { grid-column: 4 / span 5; display: flex; flex-direction: column; gap: 24px; }
  .hero-right { grid-column: 9 / span 4; display: flex; flex-direction: column; gap: 16px; }
  .mascot { background: #fff; border-radius: 16px; box-shadow: var(--shadow-card); padding: 16px; display: flex; align-items: center; gap: 16px; }
  .mascot.offset { width: 274px; margin-left: 12px; }
  .mascot-thumb { width: 80px; height: 80px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center; font-size: 34px; }
  .pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; letter-spacing: .55px; text-transform: uppercase; font-family: 'Plus Jakarta Sans', sans-serif; }
  .mascot-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; color: var(--ink); margin-top: 6px; }
  .mascot-sub { font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eyebrow-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; background: rgba(0,104,95,.1); color: var(--brand); padding: 4px 12px; border-radius: 9999px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px; }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 9999px; background: var(--brand); }
  .hero-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 44px; line-height: 52px; letter-spacing: -1.1px; color: var(--ink); }
  .grad-teal { background: linear-gradient(90deg, var(--brand), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .grad-amber { background: linear-gradient(90deg, var(--accent-ink), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-sub { font-size: 16px; line-height: 24px; max-width: 576px; }
  .search { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 11px; box-shadow: var(--shadow-float); display: flex; flex-direction: column; gap: 8px; }
  .search-row { display: flex; align-items: center; gap: 8px; padding: 0 8px; }
  .search-row input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; padding: 10px 0; color: var(--ink); }
  .search-row input::placeholder { color: var(--ink-muted); }
  .search-row .btn { padding: 12px 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 8px 4px; }
  .chips .label { font-size: 11px; font-weight: 700; color: var(--ink-2); font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: .44px; }
  .chip { background: var(--chip); color: var(--ink-2); border: 0; border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
  .chip:hover { background: #e4e6ff; }
  .popular { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; }
  .popular b { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--ink-2); }
  .chip-white { background: #fff; color: var(--ink-2); box-shadow: var(--shadow-card); border: 0; border-radius: 9999px; padding: 4px 12px; font-size: 11px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
  .chip-white:hover { color: var(--brand); }
  .cta-row { display: flex; gap: 16px; flex-wrap: wrap; padding-top: 8px; }
  .fcard { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 25px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 10px; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .row-start { display: flex; gap: 10px; align-items: center; }
  .avatar { width: 56px; height: 56px; border-radius: 9999px; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; display: grid; place-items: center; position: relative; flex-shrink: 0; font-size: 16px; }
  .avatar.lg { width: 64px; height: 64px; font-size: 18px; }
  .online { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; border-radius: 9999px; background: #10b981; box-shadow: 0 0 0 2px #fff; }
  .avatar.lg .online { width: 16px; height: 16px; }
  .fname { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 16px; color: var(--ink); display: flex; gap: 6px; align-items: center; }
  .verified { color: var(--brand); font-size: 13px; }
  .small { font-size: 12px; }
  .rating { background: rgba(255,221,184,.5); color: #2a1700; padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--chip); color: var(--ink); border-radius: 6px; padding: 2px 10px; font-size: 11px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; white-space: nowrap; }
  .tag.lg { padding: 4px 10px; border-radius: 8px; }
  .hr { border-top: 1px solid rgba(188,201,198,.2); }
  .live { background: rgba(0,104,95,.1); color: var(--brand); padding: 4px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; display: inline-flex; gap: 6px; align-items: center; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 9999px; background: var(--brand); }
  .mini { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 17px; box-shadow: var(--shadow-float); }
  .mini-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; color: var(--ink); margin-top: 8px; }
  .verified-client { background: rgba(0,104,95,.1); color: var(--brand); padding: 2px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; font-family: 'Plus Jakarta Sans', sans-serif; }
  .money-amber { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; color: var(--accent-ink); font-size: 14px; }
  .badges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .badge { background: #fff; border-radius: 12px; padding: 10px; display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1); }
  .badge-ico { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex-shrink: 0; font-size: 14px; }
  .badge-t { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 12px; color: var(--ink); }

  /* ---------- Section primitives ---------- */
  .section { padding: 40px 0; }
  .section-tint { background: rgba(242,243,255,.6); }
  .section-wide { padding: 80px 0; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 40px; flex-wrap: wrap; }
  .head-left { display: flex; flex-direction: column; gap: 4px; }
  .kicker { align-self: flex-start; background: rgba(0,104,95,.1); color: var(--brand); padding: 4px 12px; border-radius: 9999px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .55px; text-transform: uppercase; }
  .kicker.peach { background: var(--peach); color: #2a1700; }
  .kicker.sky { background: var(--sky); color: #001e2f; }
  .title-36 { font-size: 36px; line-height: 40px; margin-top: 4px; }
  .sub-16 { font-size: 16px; line-height: 24px; }
  .link-teal { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; color: var(--brand); background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap; }
  .link-teal:hover { text-decoration: underline; }
  .center-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; max-width: 672px; margin: 0 auto 40px; }

  /* ---------- Categories ---------- */
  .cat-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
  .cat-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; justify-content: space-between; gap: 16px; border: 0; text-align: left; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; min-height: 232px; }
  .cat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
  .cat-ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; }
  .cat-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); padding-top: 12px; }
  .cat-desc { font-size: 14px; line-height: 19.25px; margin-top: 4px; }
  .cat-foot { border-top: 1px solid rgba(188,201,198,.2); padding-top: 9px; display: flex; justify-content: space-between; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px; color: var(--ink-2); }
  .empty { grid-column: 1 / -1; text-align: center; padding: 32px; color: var(--ink-2); background: #fff; border-radius: 16px; }

  /* ---------- Projects ---------- */
  .proj-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 24px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 18px; line-height: 28px; color: var(--ink); }
  .card-desc { font-size: 14px; line-height: 20px; }
  .budget-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid rgba(188,201,198,.2); padding-top: 17px; flex-wrap: wrap; }
  .budget { font-size: 12px; }
  .budget b { font-family: 'Plus Jakarta Sans', sans-serif; color: var(--accent-ink); font-size: 16px; margin-left: 4px; }
  .proposals { font-size: 12px; }
  .btn-wide { width: 100%; background: #f2f3ff; color: var(--ink); border-radius: 12px; padding: 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px; border: 0; cursor: pointer; }
  .btn-wide:hover { background: #e4e6ff; }
  .timestamp { font-size: 12px; }

  /* ---------- Freelancers ---------- */
  .seg { display: flex; gap: 8px; }
  .seg button { border: 0; border-radius: 12px; padding: 8px 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px; background: var(--chip); color: var(--ink); cursor: pointer; letter-spacing: .24px; }
  .seg button.on { background: var(--brand); color: #fff; }
  .free-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 24px; }
  .free-card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }
  .free-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .free-name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .free-role { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; color: var(--brand); margin-top: 2px; }
  .free-loc { font-size: 12px; margin-top: 2px; }
  .free-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(188,201,198,.2); padding-top: 17px; }
  .rate { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 20px; color: var(--ink); }
  .rate span { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; color: var(--ink-2); margin-left: 4px; }
  .view-btn { background: rgba(0,104,95,.1); color: var(--brand); border: 0; border-radius: 12px; padding: 8px 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px; cursor: pointer; }
  .view-btn:hover { background: rgba(0,104,95,.18); }
  .view-all-wrap { display: flex; justify-content: center; margin-top: 40px; }
  .btn-pale { background: #eaedff; color: var(--ink); border: 0; border-radius: 9999px; padding: 14px 32px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: var(--shadow-card); }
  .btn-pale:hover { background: #dde1ff; }

  /* ---------- Benefits ---------- */
  .ben-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 24px; }
  .ben { background: #fff; border-radius: 16px; padding: 24px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 8px; }
  .ben-ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; margin-bottom: 8px; }
  .ben-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); }
  .ben-text { font-size: 14px; line-height: 22.75px; }

  /* ---------- How it works ---------- */
  .switch { display: inline-flex; background: #eaedff; padding: 6px; border-radius: 16px; gap: 0; margin-top: 24px; }
  .switch button { border: 0; border-radius: 12px; padding: 10px 24px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 14px; color: var(--ink-2); background: transparent; cursor: pointer; letter-spacing: .14px; }
  .switch button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-card); }
  .flow-note { font-size: 12px; margin-top: 12px; color: var(--ink-2); }
  .flow-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 24px; width: 100%; }
  .step { background: #fff; border: 1px solid rgba(188,201,198,.2); border-radius: 16px; padding: 25px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }
  .step-num { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 16px; }
  .step-title { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); margin-top: 8px; }
  .step-text { font-size: 14px; line-height: 22.75px; margin-top: 4px; }
  .step-foot { display: flex; gap: 6px; align-items: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 12px; }

  /* ---------- Stats ---------- */
  .stats { background: #283044; padding: 40px 32px; position: relative; overflow: hidden; }
  .stats::before { content: ""; position: absolute; inset: 0; opacity: .05; background-image: linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px); background-size: 32px 32px; pointer-events: none; }
  .stats-grid { position: relative; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 24px; }
  .metric { text-align: center; padding: 16px; }
  .metric-num { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 48px; line-height: 48px; }
  .metric-label { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; color: #d2d9f4; margin-top: 4px; }

  /* ---------- About ---------- */
  .about { padding: 96px 32px; background: var(--bg); }
  .about-grid { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 40px; align-items: center; }

function Categories({ query, onToast }) {
  const shown = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return CATEGORIES;
    return CATEGORIES.filter(c =>
      c.title.toLowerCase().includes(q) || c.desc.join(" ").toLowerCase().includes(q)
    );
  }, [query]);

  return (
    <section id="categories" className="section section-tint" aria-labelledby="cat-title">
      <div className="container">
        <div className="head-row">
          <div className="head-left">
            <span className="kicker">Marketplace specialties</span>
            <h2 id="cat-title" className="title-36">Explore Top Freelance Services</h2>
            <p className="sub-16">Find skilled professionals across hundreds of creative and technical categories.</p>
          </div>
          <button className="link-teal" onClick={() => onToast("The full 80+ category catalog is not in this design.")}>View All 80+ Categories →</button>
        </div>

        <div className="cat-grid">
          {shown.length === 0 && (
            <div className="empty">No categories match “{query}”. Try another search from the hero.</div>
          )}
          {shown.map(c => (
            <button key={c.title} className="cat-card" onClick={() => onToast(`Browsing ${c.title} (connects to backend later).`)}>
              <div>
                <div className="cat-ico" style={{ background: TONES[c.tone].bg, color: c.arrow }} aria-hidden="true">{c.ico}</div>
                <div className="cat-title">{c.title}</div>
                <div className="cat-desc">{c.desc.map((line, i) => <span key={i} style={{ display: "block" }}>{line}</span>)}</div>

/* ============ APP ============ */

function App() {
  const [activeNav, setActiveNav] = useState("top");
  const [categoryQuery, setCategoryQuery] = useState("");
  const [toast, setToast] = useState("");

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(""), 2800);
    return () => clearTimeout(t);
  }, [toast]);

  const navTo = (target) => {
    setActiveNav(target);
    scrollToTarget(target);
  };

  const onSearch = (q) => {
    setCategoryQuery(q);
    navTo("categories");
  };

  return (
    <>
      <a href="#main" className="sr-only">Skip to content</a>
      <Header activeNav={activeNav} onNav={navTo} onToast={setToast} />
      <main id="main">
        <Hero onSearch={onSearch} onToast={setToast} />
        <Categories query={categoryQuery} onToast={setToast} />
        <Projects onToast={setToast} />
        <Freelancers onToast={setToast} />
        <Benefits />
        <HowItWorks onToast={setToast} />
        <Stats />
        <About onToast={setToast} />
        <FinalCTA onNav={navTo} />
      </main>
      <Footer onToast={setToast} />
      {toast && <div className="toast" role="status" aria-live="polite">{toast}</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
